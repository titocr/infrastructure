name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # The repository-monitor tests use macOS plutil to lint LaunchAgent fixtures.
    runs-on: macos-15
    timeout-minutes: 10
    env:
      # Never run the opt-in, host-mutating Docker rehearsal in ordinary CI.
      GTD_UPGRADE_LIVE_TEST: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt
      - name: Run non-live Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run Node relay tests
        run: node --test tests/cpap-relay.test.mjs
      - name: Build strict manual
        run: python -m mkdocs build --strict
