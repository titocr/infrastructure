site_name: Mac Studio Infrastructure Manual
site_description: Hardware, workloads, operations and recovery for the Mac Studio
site_url: http://127.0.0.1:8088/
theme:
  name: readthedocs
  custom_dir: docs/overrides
  highlightjs: false
hooks:
  - scripts/manual_build.py
exclude_docs: |
  overrides/
nav:
  - This Mac:
      - Overview: index.md
      - Hardware and capacity: host-baseline.md
      - Service inventory: services.md
  - Services:
      - GTD Mind: projects/gtd-mind-runtime.md
      - GTD access and MCP: projects/gtd-mind-access.md
      - OSCAR: projects/cpap-monitor-runtime.md
      - Home Assistant: projects/home-assistant.md
      - Options Finder: projects/options-finder.md
      - Mac Mini media center: projects/media-center.md
      - This manual: manual.md
      - Repository monitoring: repository-monitoring.md
  - Operations and recovery:
      - Routine checks: operations.md
      - Host recovery: recovery.md
      - Backup coverage: backups.md
      - Troubleshooting: troubleshooting.md
  - Outstanding work: outstanding.md
  - Reference and history:
      - Deployment and recovery: deployment-reference.md
      - Responsibilities: concepts.md
      - Add an application: application-containerization.md
      - Runtime contract: runtime-contract.md
      - Application documentation: sources.md
      - Earlier documentation: history/index.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
strict: true
